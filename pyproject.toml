[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-siem"
version = "0.1.0"
description = "A small, self-contained SIEM for learning: log ingestion, normalisation, SQLite storage, YAML correlation rules and a Flask dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.0,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mini-siem = "mini_siem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_siem = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
