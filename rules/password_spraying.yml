id: password_spraying
name: Password spraying
description: >
  One IP fails to log in as many DIFFERENT users. Sprayers try one common
  password against many accounts, slowly, to stay under per-account lockout
  and per-IP brute-force thresholds -- so we count distinct users over a
  longer window instead of raw attempts.
severity: high
type: threshold
filter:
  event_type:
    in: [ssh_login, app_login]
  outcome: failure
group_by: source_ip
distinct: user
threshold: 5
window_seconds: 900
message: "{group} failed logins for {count} different users (rule: {threshold}+ users in {window_seconds}s)"
mitre:
  - id: T1110.003
    name: "Brute Force: Password Spraying"
    tactic: Credential Access
